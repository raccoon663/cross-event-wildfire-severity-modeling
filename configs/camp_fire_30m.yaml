# Camp Fire within-event resolution ablation.
# These scene identifiers are the exact MTBS pre- and post-fire acquisitions.
experiment: camp_resolution_ablation
resolution_m: 30
target_crs: "EPSG:32610"
fire_id: CA3982012144020181108
fire_name: CAMP
fire_year: 2018
pre_item_id: LC08_L2SP_044032_20180719_02_T1
post_item_id: LC08_L2SP_044032_20190722_02_T1
mtbs_assessment_type: Extended

# Spatial blocking prevents neighbouring pixels from leaking across the fold
# boundary; 5 km is large relative to the fire's autocorrelation scale.
spatial_block_m: 5000
n_splits: 5
random_seed: 2026

rf:
  n_estimators: 350
  min_samples_leaf: 5
  max_features: sqrt
  class_weight: balanced_subsample
  max_train_pixels_per_class: 25000
