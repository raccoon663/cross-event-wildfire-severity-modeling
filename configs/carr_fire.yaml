# Carr Fire strict external validation: Camp-only training, no Carr tuning.
experiment: camp_to_carr_external_validation
resolution_m: 30
target_crs: "EPSG:32610"
train_fire_id: CA3982012144020181108   # Camp Fire
test_fire_id: CA4065012263020180723    # Carr Fire
test_fire_name: CARR
fire_year: 2018
pre_item_id: LC08_L2SP_045032_20180710_02_T1
post_item_id: LC08_L2SP_045032_20190729_02_T1
mtbs_assessment_type: Extended

random_seed: 2026

# Frozen from Camp's own MTBS event thresholds; applied to Carr unchanged.
# This is the fair cross-event baseline because it involves no test-event data.
frozen_camp_dnbr_thresholds: [0.060, 0.301, 0.570]

rf:
  n_estimators: 350
  min_samples_leaf: 5
  max_features: sqrt
  class_weight: balanced_subsample
  max_train_pixels_per_class: 25000
